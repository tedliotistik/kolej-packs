name: Vend Finder

on:
  push:
    paths:
      - "growtopia-vend-finder/**"
      - ".github/workflows/vend-finder.yml"
  pull_request:
    paths:
      - "growtopia-vend-finder/**"
      - ".github/workflows/vend-finder.yml"
  workflow_dispatch:

concurrency:
  group: vend-finder-${{ github.ref }}
  cancel-in-progress: true

env:
  # GTProxy commit the patch was written against. (The next upstream commit,
  # f51c5a3 "style: keep code style consistent", does not compile.)
  GTPROXY_REPO: https://github.com/ZTzTopia/GTProxy.git
  GTPROXY_COMMIT: 0105cd5e7f9312cf9289faf18596d357068da088
  BUILD_TYPE: Release

jobs:
  test-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa pytest websocket-client
      - run: xvfb-run -a pytest -q growtopia-vend-finder/tests

  build-overlay:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pytest websocket-client
      - run: pytest -q growtopia-vend-finder/tests/test_overlay.py
      - name: Build VendOverlay.exe
        working-directory: growtopia-vend-finder/overlay
        run: pyinstaller --noconfirm --onefile --windowed --name VendOverlay vend_overlay.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force VendOverlay | Out-Null
          Copy-Item growtopia-vend-finder\overlay\dist\VendOverlay.exe VendOverlay
          Copy-Item growtopia-vend-finder\README.md VendOverlay\OKU-BENI.md
      - uses: actions/upload-artifact@v4
        with:
          name: VendOverlay-windows
          path: VendOverlay

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GTProxy
        shell: bash
        run: |
          git init gtproxy
          cd gtproxy
          git remote add origin "$GTPROXY_REPO"
          git fetch --depth 1 origin "$GTPROXY_COMMIT"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Apply Vend Finder patch
        shell: bash
        working-directory: gtproxy
        run: git apply --whitespace=nowarn ../growtopia-vend-finder/patches/*.patch

      - name: Install conan
        run: pip install "conan>2.0"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('gtproxy/conanfile.py') }}
          restore-keys: ${{ runner.os }}-conan-

      - name: Configure
        # Conan downloads dependency sources (e.g. www.lua.org) which sometimes
        # time out on the runners, so retry a few times before giving up.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            cmake -S gtproxy -B gtproxy/build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" && exit 0
            echo "Configure attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Build
        run: cmake --build gtproxy\build --config ${{ env.BUILD_TYPE }} --target Proxy

      - name: Package
        shell: pwsh
        run: |
          $out = "VendFinder"
          New-Item -ItemType Directory -Force "$out\scripts", "$out\resources" | Out-Null
          Copy-Item "gtproxy\build\src\${{ env.BUILD_TYPE }}\*.exe" $out
          Copy-Item "gtproxy\build\conan\build\*.dll" $out -ErrorAction SilentlyContinue
          Copy-Item "gtproxy\resources\*" "$out\resources"
          # Mozilla CA list used by patches/0002 for DNS-over-HTTPS lookups.
          Invoke-WebRequest "https://curl.se/ca/cacert.pem" -OutFile "$out\resources\cacert.pem" -MaximumRetryCount 3 -RetryIntervalSec 10
          Copy-Item "growtopia-vend-finder\scripts\vend_finder.lua" "$out\scripts"
          Copy-Item "growtopia-vend-finder\scripts\auto_tile.lua" "$out\scripts"
          Copy-Item "growtopia-vend-finder\windows\*" $out
          Copy-Item "growtopia-vend-finder\README.md" "$out\OKU-BENI.md"
          Copy-Item "gtproxy\LICENSE" "$out\GTProxy-LICENSE.txt"

          # Bundle every non-Windows DLL Proxy.exe needs. cpp-httplib links the
          # runner's OpenSSL 3 (libssl-3-x64.dll / libcrypto-3-x64.dll), which is
          # not on players' PCs; the MSVC runtime may be missing too.
          $searchDirs = @()
          $cache = Get-Content "gtproxy\build\CMakeCache.txt"
          $inc = ($cache | Select-String '^OPENSSL_INCLUDE_DIR:PATH=(.+)$').Matches | ForEach-Object { $_.Groups[1].Value }
          if ($inc) { $searchDirs += (Join-Path (Split-Path $inc -Parent) "bin") }
          $searchDirs += Get-Item "C:\Program Files\OpenSSL*\bin" -ErrorAction SilentlyContinue | ForEach-Object FullName
          $searchDirs += "gtproxy\build\conan\build"
          Write-Host "DLL search dirs: $($searchDirs -join '; ')"

          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $sys32 = "$env:SystemRoot\System32"
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $queue.Enqueue((Get-ChildItem "$out\*.exe" | Select-Object -First 1).FullName)
          $seen = @{}
          $missing = @()
          while ($queue.Count -gt 0) {
            $bin = $queue.Dequeue()
            $deps = & $dumpbin /nologo /dependents $bin | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
            foreach ($d in $deps) {
              $key = $d.ToLower()
              if ($seen[$key]) { continue }
              $seen[$key] = $true
              if (Test-Path "$out\$d") { $queue.Enqueue("$out\$d"); continue }
              $src = $searchDirs | ForEach-Object { Join-Path $_ $d } | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $src -and $key -match '^(vcruntime|msvcp|concrt)' -and (Test-Path "$sys32\$d")) { $src = "$sys32\$d" }
              if ($src) {
                Copy-Item $src $out
                Write-Host "Bundled $d from $src"
                $queue.Enqueue("$out\$d")
              } elseif (-not (Test-Path "$sys32\$d") -and $key -notmatch '^(api-ms-|ext-ms-)') {
                $missing += $d
              }
            }
          }
          if ($missing.Count -gt 0) { throw "DLLs not bundled: $($missing -join ', ')" }
          Get-ChildItem -Recurse $out | Select-Object FullName

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VendFinder-windows
          path: VendFinder
